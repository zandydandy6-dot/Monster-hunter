name: build
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Unzip src and tools if still zipped
        run: |
          for n in src tools; do
            if [ -f $n.zip ]; then
              rm -rf _tmp && mkdir _tmp
              unzip -q -o $n.zip -d _tmp
              mkdir -p $n
              if [ -d _tmp/$n ]; then cp -r _tmp/$n/. $n/; else cp -r _tmp/. $n/; fi
              rm -f $n.zip
            fi
          done
          rm -rf _tmp
          if [ -n "$(git status --porcelain)" ]; then
            git config user.name "github-actions"
            git config user.email "actions@github.com"
            git add -A
            git commit -m "Unzip src and tools"
            git push
          fi

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Download Forge MDK
        run: |
          curl -fL -o mdk.zip https://maven.minecraftforge.net/net/minecraftforge/forge/1.20.1-47.3.0/forge-1.20.1-47.3.0-md
