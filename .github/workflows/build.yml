name: build
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Download Forge MDK
        run: |
          curl -fsSL https://maven.minecraftforge.net/net/minecraftforge/forge/maven-metadata.xml -o meta.xml
          grep -o '1\.20\.1-47\.[0-9.]*' meta.xml | sort -uV | tac > versions.txt
          echo "Versions found:"; head -5 versions.txt
          ok=0
          for v in $(cat versions.txt); do
            echo "Trying $v"
            if curl -fsSL -o mdk.zip "https://maven.minecraftforge.net/net/minecraftforge/forge/$v/forge-$v-mdk.zip"; then
              echo "Got MDK $v"; ok=1; break
            fi
          done
          [ "$ok" = 1 ] || { echo "No MDK found"; exit 1; }
          mkdir _mdk
          unzip -q mdk.zip -d _mdk

      - name: Merge mod into MDK
        run: |
          rm -rf _mdk/src/main/java/com/example
          rm -f _mdk/src/main/resources/META-INF/mods.toml
          cp -r src/. _mdk/src/
          cd _mdk
          sed -i 's/^mod_id=.*/mod_id=hagoyama/' gradle.properties
          sed -i 's/^mod_name=.*/mod_name=Monster Hunter/' gradle.properties
          sed -i 's/^mod_group_id=.*/mod_group_id=com.hagoyama/' gradle.properties
          cat >> build.gradle <<'EOF'

          repositories {
              maven { url = 'https://dl.cloudsmith.io/public/geckolib3/geckolib/maven/' }
              maven { url = 'https://maven.kosmx.dev/' }
              maven { url = 'https://maven.theillusivec4.top/' }
          }
          dependencies {
              implementation fg.deobf('software.bernie.geckolib:geckolib-forge-1.20.1:4.4.9')
              implementation fg.deobf('dev.kosmx.player-anim:player-animation-lib-forge:1.0.2-rc1+1.20')
              runtimeOnly fg.deobf('top.theillusivec4.curios:curios-forge:5.9.1+1.20.1')
          }
          EOF

      - name: Build
        working-directory: _mdk
        run: |
          chmod +x gradlew
          ./gradlew build --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: monster-hunter-jar
          path: _mdk/build/libs/*.jar
