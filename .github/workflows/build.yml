name: unzip
on: workflow_dispatch
permissions:
  contents: write
jobs:
  unzip:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Unzip src and tools
        run: |
          for n in src tools; do
            rm -rf _tmp && mkdir _tmp
            unzip -q -o $n.zip -d _tmp
            mkdir -p $n
            if [ -d _tmp/$n ]; then cp -r _tmp/$n/. $n/; else cp -r _tmp/. $n/; fi
            rm -f $n.zip
          done
          rm -rf _tmp
      - name: Commit
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add -A
          git commit -m "Unzip src and tools"
          git push
